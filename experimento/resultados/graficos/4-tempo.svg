  <style>
    svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --base:#c3c2b7; --A:#2a78d6; --B:#eb6834; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
