<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Intervenções humanas até o fim">
  <style>
    svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --base:#c3c2b7; --A:#2a78d6; --B:#eb6834; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --base:#383835; --A:#3987e5; --B:#d95926; } }
    .fundo { fill: var(--surface); }
    .titulo { fill: var(--ink); font-size: 18px; font-weight: 600; }
    .subtitulo { fill: var(--ink2); font-size: 13px; }
    .eixo { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .rotulo { fill: var(--ink2); font-size: 12px; }
    .valor { fill: var(--ink); font-size: 12px; font-weight: 600; }
    .grade { stroke: var(--grid); stroke-width: 1; }
    .base { stroke: var(--base); stroke-width: 1; }
    .media { stroke: var(--ink2); stroke-width: 1.5; }
    .A { fill: var(--A); } .B { fill: var(--B); }
  </style>
<rect class="fundo" width="720" height="400"/>
<text x="56" y="32" class="titulo">Intervenções humanas até o fim</text>
<text x="56" y="52" class="subtitulo">Prompts de correção + edições manuais + outras mensagens humanas depois do prompt inicial.</text>
<g transform="translate(56,78)">
    <rect x="0" y="-9" width="10" height="10" rx="2" class="A"/><text x="16" y="0" class="rotulo">Sem harness (A)</text>
    <rect x="150" y="-9" width="10" height="10" rx="2" class="B"/><text x="166" y="0" class="rotulo">Com harness (B)</text>
  </g>
<line x1="56" x2="624" y1="336" y2="336" class="base"/>
<text x="48" y="340" text-anchor="end" class="eixo">0</text>
<line x1="56" x2="624" y1="96" y2="96" class="grade"/>
<text x="48" y="100" text-anchor="end" class="eixo">1</text>
<path d="M138.66666666666669,336 V100 Q138.66666666666669,96 142.66666666666669,96 H158.66666666666669 Q162.66666666666669,96 162.66666666666669,100 V336 Z" class="A"><title>ENSAIO-A: 1 intervenção(ões)</title></path>
<text x="150.66666666666669" y="90" text-anchor="middle" class="valor">1</text>
<text x="150.66666666666669" y="354" text-anchor="middle" class="rotulo">ENSAIO-A</text>
<line x1="517.3333333333334" x2="541.3333333333334" y1="336" y2="336" class="base"><title>ENSAIO-B: 0 intervenção(ões)</title></line>
<text x="529.3333333333334" y="330" text-anchor="middle" class="valor">0</text>
<text x="529.3333333333334" y="354" text-anchor="middle" class="rotulo">ENSAIO-B</text>
<text x="150.66666666666669" y="376" text-anchor="middle" class="subtitulo">Sem harness (A)</text>
<line x1="126.66666666666669" x2="174.66666666666669" y1="96" y2="96" class="media"><title>Média Sem harness (A): 1</title></line>
<text x="180.66666666666669" y="100" class="rotulo">média 1</text>
<text x="529.3333333333334" y="376" text-anchor="middle" class="subtitulo">Com harness (B)</text>
<line x1="505.33333333333337" x2="553.3333333333334" y1="336" y2="336" class="media"><title>Média Com harness (B): 0</title></line>
<text x="559.3333333333334" y="340" class="rotulo">média 0</text>
</svg>
